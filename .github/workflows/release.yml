name: Clean Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Publish WinForms App
        run: dotnet publish desktop/AlexaAlarmSkip.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/desktop

      - name: Bundle Node.js App Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -Path prototype, src, assets, www, node_modules -Destination dist/desktop -Recurse
          Copy-Item -Path package.json -Destination dist/desktop

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $zipName = "alexa-alarm-skip-windows_${tag}.zip"
          Compress-Archive -Path "dist/desktop/*" -DestinationPath $zipName
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "checksums-windows.txt"),
            "$hash  $zipName`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            *.zip
            checksums-windows.txt

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install & Sync Capacitor
        run: |
          npm ci
          npm run cap:sync
          chmod +x android/gradlew

      - name: Prepare Keystore for Signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          echo "$KEYSTORE_PROPERTIES" > android/keystore.properties

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Cleanup Keystore Secrets
        if: always()
        run: rm -f android/keystore/release.jks android/keystore.properties

      - name: Prepare APK
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_NAME="alexa-alarm-skip-android_${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            *.apk
            checksums-android.txt

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Combine Checksums
        run: |
          cat dist/windows-build/checksums-windows.txt dist/android-build/checksums-android.txt > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows-build/*.zip
            dist/android-build/*.apk
            checksums.txt
