<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexa アラーム管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="title-wrap">
      <h1>Alexa アラーム管理</h1>
      <div class="subtitle" id="metaText">バックエンドを起動中...</div>
    </div>
    <button class="btn-icon" id="refreshBtn" title="一覧を更新" aria-label="一覧を更新" disabled>
      <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </header>

  <section class="login-panel" id="loginPanel" hidden>
    <div class="login-card">
      <h2>Amazon へのログインが必要です</h2>
      <p class="login-desc">セッションの有効期限が切れているか、未ログイン状態です。下のボタンから Amazon アカウントにログインしてください。</p>
      <button class="btn-login" id="openLoginBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"/>
          <path d="M10 14 21 3"/>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
        <span>Amazon でログイン</span>
      </button>
      <div class="login-wait" id="loginWaitText">ログイン完了を待機しています...（完了すると自動で一覧に戻ります）</div>
    </div>
  </section>

  <nav class="tabs" id="tabsNav" role="tablist" aria-label="表示切り替え">
    <button class="tab-btn active" id="tabActiveBtn" type="button" role="tab" aria-selected="true" data-tab="active">
      <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span>直近のアラーム (<span id="countText">0</span>)</span>
    </button>
    <button class="tab-btn" id="tabSkippedBtn" type="button" role="tab" aria-selected="false" data-tab="skipped">
      <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="14" y="4" width="4" height="16" rx="1"/>
        <rect x="6" y="4" width="4" height="16" rx="1"/>
      </svg>
      <span>スキップ済み (<span id="skippedCountText">0</span>)</span>
    </button>
  </nav>

  <main class="tab-panel" id="panelActive" role="tabpanel">
    <div class="list" id="timelineList"></div>
  </main>

  <section class="tab-panel" id="panelSkipped" role="tabpanel" hidden>
    <div class="skipped-actions">
      <button class="btn-restore-all" id="restoreAllBtn" type="button">すべて元に戻す</button>
    </div>
    <div class="list" id="skippedList"></div>
  </section>

  <div class="status-bar" id="statusBar">準備中...</div>
</div>
<div id="loadingOverlay" class="loading-overlay hidden" aria-hidden="true" aria-busy="true">
  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"><animateTransform attributeName="transform" dur="0.75s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12"/></path></svg>
</div>
<script src="app.js"></script>
</body>
</html>
